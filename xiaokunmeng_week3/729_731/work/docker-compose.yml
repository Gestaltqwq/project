# =====================================================
# 保险精准营销系统 · docker-compose（本地开发 / 一键部署）
# 一键构建启动：docker compose up --build -d
# 查看状态：    docker compose ps
# 停止：        docker compose down
# 完整清场：    docker compose down -v（会删数据卷，慎用）
# =====================================================
services:
  insurance-ai:
    build: .
    container_name: insurance-ai
    ports:
      - "5000:5000"        # 宿主机 5000 → 容器 5000，本地访问 http://localhost:5000
    environment:
      # 从 work/.env 自动读取；JWT_SECRET_KEY 必须为 ≥16 位强随机密钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请先配置 .env 中的 JWT_SECRET_KEY}
      DATABASE_URL: sqlite:////app/instance/insurance.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    volumes:
      - ./instance:/app/instance   # 数据库持久化
      - ./data:/app/data           # 模型/图表/上传数据持久化
    init: true                     # tini 进程管理，正确响应 Ctrl+C / 停止信号
    restart: unless-stopped        # 异常退出自动重启
